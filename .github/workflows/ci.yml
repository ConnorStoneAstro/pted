name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 3
  PROJECT_NAME: "pted"
  # Keep matplotlib off any GUI backend. The runners ship a tkinter that
  # matplotlib will happily select and that then fails to initialise Tcl.
  # tests/conftest.py sets this too; belt and braces, and it also covers any
  # plotting reached outside pytest.
  MPLBACKEND: Agg

jobs:
  build:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
      - name: Checkout pted
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Record State
        run: |
          pwd
          echo github.ref is: ${{ github.ref }}
          echo GITHUB_SHA is: $GITHUB_SHA
          echo github.event_name is: ${{ github.event_name }}
          echo github workspace: ${{ github.workspace }}
          pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov wheel

      # We only want to install this on one run, because otherwise we'll have
      # duplicate annotations.
      - name: Install error reporter
        if: ${{ matrix.python-version == '3.13' }}
        run: |
          python -m pip install pytest-github-actions-annotate-failures

      - name: Install pted
        run: |
          pip install -e .[dev]
          pip show ${{ env.PROJECT_NAME }}

      # The dev extra deliberately omits torch, so skipping this leaves 3.13
      # genuinely torch-free and the no-torch code path gets exercised.
      - name: Install torch # no torch on 3.13 to test no-torch scenario
        if: ${{ matrix.python-version != '3.13' }}
        run: |
          pip install -e .[torch]

      - name: Test with pytest
        run: |
          pytest -vvv --cov=${{ env.PROJECT_NAME }} --cov-report=xml --cov-report=term tests/

      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}